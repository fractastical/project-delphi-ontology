<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Project Delphi — The evidence behind the answer</title><desc id="desc">An open vocabulary for papers, claims, evidence, and hypotheses. The knowledge model behind Science Oracle.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d38"/><stop offset="1" stop-color="#071a24"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#769ca5" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="340" rx="16" fill="url(#bg)"/><rect width="1200" height="340" rx="16" fill="url(#grid)"/><path d="M0 313 Q300 255 600 305 T1200 275" fill="none" stroke="#64b5b2" stroke-opacity=".2"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="58" fill="#91d1c9" font-size="13" letter-spacing="3">SCIENCE ORACLE / OPEN KNOWLEDGE</text><text x="56" y="121" fill="#f4f5f0" font-size="52" font-weight="700">Project Delphi</text><text x="56" y="167" fill="#e5d5aa" font-size="25">The evidence behind the answer.</text><text x="56" y="208" fill="#acc2c9" font-size="17">An open vocabulary for scientific knowledge and uncertainty.</text><g stroke="#70b9b3" stroke-width="2" fill="none"><path d="M90 270 H1090" stroke-opacity=".45"/><circle cx="90" cy="270" r="7" fill="#91d1c9"/><circle cx="390" cy="270" r="7" fill="#91d1c9"/><circle cx="690" cy="270" r="7" fill="#91d1c9"/><circle cx="1090" cy="270" r="7" fill="#e5d5aa" stroke="#e5d5aa"/></g><g fill="#d6e4e6" font-size="14"><text x="90" y="303" text-anchor="middle">Papers</text><text x="390" y="303" text-anchor="middle">Claims</text><text x="690" y="303" text-anchor="middle">Evidence</text><text x="1090" y="303" text-anchor="middle">Hypotheses</text></g><g stroke="#709da9" fill="#102d38"><path d="M900 74 L1035 107 L1113 51 M1035 107 L1100 188 M900 74 L930 191 L1035 107" fill="none" stroke